<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script src="vendor/brush.js"></script>
<script src="scene.js"></script>
<script>
brush.createCanvas(SW, SH, { id: 'c' });
brush.scaleBrushes(2.5);
brush.angleMode(brush.DEGREES);

function stroke(pts, name, col, w, seed) {
  if (pts.length < 2) return;
  const a = pts[0], b = pts[pts.length - 1];
  if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 2 && pts.length < 3) return;
  brush.seed(seed);
  brush.noFill(); brush.noHatch();
  brush.set(name, col, w);
  brush.spline(pts, 0.5);
}

window.renderAt = function (t) {
  brush.clear(COL.paper);
  brush.push();
  brush.translate(-SW / 2, -SH / 2);

  // morro: aquarela + hachura (revelada por cortina da esquerda para a direita)
  const ps = prog(t, 'shade');
  if (ps > 0) {
    brush.seed(11);
    brush.noStroke(); brush.noHatch();
    brush.fill(COL.hill, 120 * ease(ps));
    brush.polygon(HILL_POLY);
    brush.noFill();
    brush.seed(12);
    brush.clip([0, 0, SW * ease(ps), SH]);
    brush.hatchStyle('HB', COL.shade, 1.4);
    brush.hatch(12, 35, { rand: 0.15 });
    brush.noStroke();
    brush.polygon(HILL_POLY);
    brush.noHatch(); brush.noClip();
  }

  // sol: aquarela que ganha pigmento
  const pSun = prog(t, 'sun');
  if (pSun > 0) {
    brush.seed(21);
    brush.noStroke(); brush.noHatch();
    brush.fill(COL.sun, 170 * ease(pSun));
    brush.circle(SUN[0], SUN[1], SUN[2]);
    brush.noFill();
  }

  // linhas
  stroke(partial(HILL, prog(t, 'hill')), '2B', COL.ink, 2.6, 31);
  stroke(partial(TRUNK, prog(t, 'trunk')), '2B', COL.ink, 4.5, 32);
  const pb = prog(t, 'branches');
  BRANCHES.forEach((b, i) => {
    const p = Math.max(0, Math.min(1, pb * 1.6 - i * 0.3));
    if (p > 0) stroke(partial(b, p), '2B', COL.ink, 2.4, 40 + i);
  });

  // copa: aquarela verde
  const pc = prog(t, 'crown');
  if (pc > 0) {
    brush.seed(51);
    brush.noStroke(); brush.noHatch();
    brush.fill(COL.leaf, 150 * ease(pc));
    brush.circle(CROWN[0], CROWN[1], CROWN[2]);
    brush.noFill();
  }

  brush.pop();
  brush.render();
  return true;
};
</script>
</body></html>
