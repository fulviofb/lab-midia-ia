  notes: App local (localhost:4318) que decompõe um vídeo de referência (ritmo, duração
    dos planos, BPM, transições, cor, enquadramento, câmera), propõe um plano para aprovação
    (storyboard, personagens, quadros de estilo) e produz um vídeo 2D novo no mesmo estilo
    com até 6 agentes Claude Code ou Codex, cada plano revisado por outro agente com
    prints de antes/depois. Aprende a técnica, não reaproveita o material da referência.
