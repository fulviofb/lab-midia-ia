    e traz cinco motores novos (giz de cera, pixel art, recorte de papel, quadro branco,
    anime). Código MIT; Remotion não vem incluído. Contagem de estrelas zerada em 20/10/2026
    (repo ficou privado por engano). CUSTO - exige assinatura paga de Claude Code ou Codex; roda na cota do
    usuário (1 a 3,5 h para 30 a 60 s); não apresentar como gratuito ao público. TTS
    padrão é taiwanês (Yating); em PT-BR, importar narração própria. Agentes rodam com
    acceptEdits (Claude) e danger-full-access (Codex) - instalar em pasta isolada, fora
    do OneDrive. Traz cópias próprias das skills HyperFrames; não misturar com as globais.
    Piloto 2026-11-10 (só fase de plano) - bom diretor de ritmo e decomposição da
    referência; reprovado em fidelidade a folha de personagem (motor em código desenha
    boneco genérico). Não usar para personagens com folha própria (como o Pietro).
