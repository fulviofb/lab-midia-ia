    três camadas, silêncios antes da virada, J/L-cut, tempo mínimo de legenda, um movimento
    nativo do meio no pico). Ver docs/testes/chroma-composite-aquarela-teste.md.
  use_cases:
  - Usar o guia de direção como checklist de som, ritmo e câmera antes de renderizar.
  - Pintar elementos pincelada a pincelada e criar transições de pincel em vídeo programático.
