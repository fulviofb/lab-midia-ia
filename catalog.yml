  notes: Biblioteca de desenho natural (lápis, carvão, marcador, preenchimento em aquarela
    com bordas e granulação, hachura e campos vetoriais). É o motor que a skill painted-animation
    do opus-video-skills usa. Tem dois builds — um para p5.js 2.x e um standalone que
    só precisa de WebGL2 — e traz um llms.txt para agentes. Testado na nuvem (Linux,
    Chrome headless com SwiftShader) contra o motor de pincelada do lemo-opuscar, na
    mesma cena de 5 s. Com brush.seed() fixo por elemento, o mesmo tempo gera o mesmo
    quadro e as áreas prontas não tremem. A aquarela e a hachura são bem mais ricas;
    em troca, é mais lento — no Windows com GPU Intel integrada, 150 quadros levaram 14 s
    (lemo-opuscar, 7 s); na nuvem sem GPU, ~157 s. Ainda não testado dentro do Remotion
    ou do HyperFrames. Ver docs/testes/p5brush-vs-lemo-pincel-teste.md.
  use_cases:
  - Pintar explicativos ilustrados em aquarela, grafite ou nanquim inteiramente em código.
