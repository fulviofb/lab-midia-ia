# catalog.yml — atualizado por update_github_metadata.py em 2026-07-04 18:30:22
metadata:
  name: lab-midia-ia
  description: Curadoria prática de ferramentas, skills, prompts e workflows para criar vídeo, voz, imagem, design e edição
    com IA.
  language: pt-BR
  status: draft
  curation_principles:
    - Priorizar ferramentas reproduzíveis, agent-friendly e com licença clara.
    - Separar geração, edição, voz, imagem, design e prompt engineering.
    - Linkar fontes sem licença clara; copiar/adaptar apenas material compatível.
    - Documentar custos, dependências, riscos de privacidade e uso ético.
categories:
  video_programatico: Criar vídeo por código, HTML, React, Remotion, HyperFrames ou agentes.
  edicao_video: Editar, cortar, legendar, colorir, renderizar e pós-produzir vídeos.
  video_automatico_social: Gerar reels, shorts, anúncios e vídeos sociais com pipeline automatizado.
  video_generativo_cinematico: Modelos, prompts e direção para geração de vídeo em Seedance, Higgsfield, Kling, Sora, Veo
    e similares.
  voz_tts_clonagem: TTS, clonagem de voz, voice conversion, narração e ditado.
  imagem_design_prompts: Prompts de imagem, design visual, UI/UX, thumbnails, capas e consistência visual.
  modelos_referencia: Modelos e projetos técnicos relevantes para estudo.
