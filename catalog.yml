metadata:
  name: lab-midia-ia
  description: "Curadoria prática de ferramentas, skills, prompts e workflows para criar vídeo, voz, imagem, design e edição com IA."
  language: pt-BR
  status: draft
  curation_principles:
    - "Priorizar ferramentas reproduzíveis, agent-friendly e com licença clara."
    - "Separar geração, edição, voz, imagem, design e prompt engineering."
    - "Linkar fontes sem licença clara; copiar/adaptar apenas material compatível."
    - "Documentar custos, dependências, riscos de privacidade e uso ético."

categories:
  video_programatico: "Criar vídeo por código, HTML, React, Remotion, HyperFrames ou agentes."
  edicao_video: "Editar, cortar, legendar, colorir, renderizar e pós-produzir vídeos."
  video_automatico_social: "Gerar reels, shorts, anúncios e vídeos sociais com pipeline automatizado."
  video_generativo_cinematico: "Modelos, prompts e direção para geração de vídeo em Seedance, Higgsfield, Kling, Sora, Veo e similares."
  voz_tts_clonagem: "TTS, clonagem de voz, voice conversion, narração e ditado."
  imagem_design_prompts: "Prompts de imagem, design visual, UI/UX, thumbnails, capas e consistência visual."
  modelos_referencia: "Modelos e projetos técnicos relevantes para estudo."

repositories:
  - name: video-use
    full_name: browser-use/video-use
    url: https://github.com/browser-use/video-use
    category: edicao_video
    subcategory: agent_video_editing
    priority: essential
    status: partially_tested_windows
    language: Python
    license: MIT
    stars_observed: 14603
    agent_fit: high
    copy_policy: can_reference_and_test
    notes: "Teste local no Windows validou uv sync, timeline_view.py, render.py com EDL manual, transcript fake e takes_packed.md. Subtitles funcionaram via workaround manual; render.py --build-subtitles falhou por escape de path Windows. Falta testar transcrição ElevenLabs e fluxo real com fala. Ver docs/testes/video-use-primeiro-teste.md."
    use_cases:
      - "Editar vídeos brutos com agentes de código."
      - "Cortar silêncios, filler words e falsos começos."
      - "Gerar legendas, color grading, fades e overlays."

  - name: hyperframes
    full_name: heygen-com/hyperframes
    url: https://github.com/heygen-com/hyperframes
    category: video_programatico
    subcategory: html_to_video
    priority: essential
    status: tested_recommended_windows
    language: TypeScript
    license: Apache-2.0
    stars_observed: 32957
    install_hint: "npx skills add heygen-com/hyperframes"
    agent_fit: high
    copy_policy: can_reference_and_test
    notes: "Teste local no Windows validou skills/init, lint, validate, inspect, snapshot e render --strict de composição HTML/CSS/GSAP. Foi necessário configurar HYPERFRAMES_BROWSER_PATH e PRODUCER_HEADLESS_SHELL_PATH para Chrome do sistema porque browser ensure encontrou cache headless quebrado. Ver docs/testes/hyperframes-primeiro-teste.md."
    use_cases:
      - "Renderizar HTML/CSS/animações seekable como MP4."
      - "Criar vídeos com agentes a partir de HTML."

  - name: remotion-agent-skills
    full_name: remotion-dev/remotion/packages/skills
    url: https://www.remotion.dev/docs/ai/skills
    category: video_programatico
    subcategory: remotion
    priority: essential
    status: practical
    language: TypeScript
    license: custom-remotion-license
    install_hint: "npx skills add remotion-dev/skills"
    agent_fit: high
    copy_policy: link_only_review_terms_before_commercial_use
    notes: "Remotion usa licença especial: indivíduos e pequenas empresas podem usar gratuitamente, mas empresas maiores/for-profit podem precisar de licença comercial. Ver https://remotion.dev/license."
    use_cases:
      - "Ensinar agentes a usar Remotion corretamente."
      - "Criar vídeos programáticos com React."

